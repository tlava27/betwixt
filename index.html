<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betwixt</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <header>
      <h1>Betw<span class="flip-i">i</span>xt</h1>
      <p class="subtitle">Guess the word that links them.</p>
    </header>

    <div class="streak-row">
      <span id="streak" class="streak" aria-live="polite"></span>
      <button id="streak-info-button" class="info-button" aria-label="How points streak scoring works" aria-expanded="false">?</button>
      <button id="history-open-button" class="history-open-button" aria-label="View puzzle history">📅</button>
    </div>
    <div id="streak-info" class="streak-info" hidden>
      <ul>
        <li>Solve in 1 guess: <strong>+5</strong></li>
        <li>Solve in 2 guesses: <strong>+3</strong></li>
        <li>Solve in 3 guesses: <strong>+1</strong></li>
        <li>Miss all 3, or skip a day: points streak resets to <strong>0</strong></li>
      </ul>
    </div>

    <div id="game">
      <div id="puzzle-display" class="puzzle-display" aria-live="polite"></div>

      <form id="guess-form" autocomplete="off">
        <input id="guess-input" type="text" placeholder="Type your guess" aria-label="Your guess">
        <button type="submit">Guess</button>
      </form>

      <div id="attempts" class="attempts" aria-live="polite"></div>
      <div id="message" class="message" aria-live="polite"></div>

      <button id="share-button" class="share-button" hidden>Share result</button>
    </div>

    <div class="beta-tools">
      <button id="skip-day-button" class="skip-day-button">Skip to next day (beta testing)</button>
    </div>
  </main>

  <div id="history-modal" class="history-modal-overlay" hidden>
    <div class="history-modal" role="dialog" aria-label="Puzzle history" aria-modal="true">
      <div class="history-modal-header">
        <button id="history-prev-month" class="month-nav-button" aria-label="Previous month">‹</button>
        <span id="history-month-label" class="history-month-label"></span>
        <button id="history-next-month" class="month-nav-button" aria-label="Next month">›</button>
      </div>
      <div class="history-weekdays">
        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
      </div>
      <div id="history-grid" class="history-grid"></div>
      <div class="history-legend">
        <span><span class="legend-dot legend-five"></span> 5 points</span>
        <span><span class="legend-dot legend-three"></span> 3 points</span>
        <span><span class="legend-dot legend-one"></span> 1 point</span>
        <span><span class="legend-dot legend-missed"></span> missed puzzle</span>
        <span><span class="legend-dot legend-skipped"></span> missed day</span>
      </div>
      <p id="history-share-message" class="message"></p>
      <button id="history-share-button" class="share-button">Share history</button>
      <button id="history-close-button" class="history-close-button">Close</button>
    </div>
  </div>

  <script src="puzzles.js"></script>
  <script src="script.js"></script>
</body>
</html>
